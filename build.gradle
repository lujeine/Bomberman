plugins {
    id 'java'
}

group 'com.yourdomain'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    implementation "com.badlogicgames.gdx:gdx:1.12.0"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl:1.10.0"
    implementation "com.badlogicgames.gdx:gdx-platform:1.10.0:natives-desktop"
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
        buildscript {


            repositories {
                mavenLocal()
                mavenCentral()
                gradlePluginPortal()
                maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
                google()
            }
            dependencies {


            }
        }

        allprojects {
            apply plugin: "eclipse"
            sourceCompatibility = 1.8
            targetCompatibility = 1.8

            version = '1.0'
            ext {
                appName = "Bomberman"
                gdxVersion = '1.12.1'
                roboVMVersion = '2.3.20'
                box2DLightsVersion = '1.5'
                ashleyVersion = '1.7.4'
                aiVersion = '1.8.2'
                gdxControllersVersion = '2.2.1'
            }

            repositories {
                mavenLocal()
                mavenCentral()
                google()
                gradlePluginPortal()
                maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
                maven { url "https://oss.sonatype.org/content/repositories/releases/" }
                maven { url "https://jitpack.io" }
            }
        }

        project(":desktop") {
            apply plugin: "java-library"


            dependencies {
                implementation project(":core")
                api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
                api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
                api "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-desktop"
                api "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
                api "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"

            }
        }

        project(":core") {
            apply plugin: "java-library"


            dependencies {
                api "com.badlogicgames.gdx:gdx:$gdxVersion"
                api "com.badlogicgames.gdx:gdx-bullet:$gdxVersion"
                api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
                api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
                api "com.badlogicgames.box2dlights:box2dlights:$box2DLightsVersion"
                api "com.badlogicgames.ashley:ashley:$ashleyVersion"
                api "com.kotcrab.vis:vis-ui:1.4.11"

            }
        }}}
